[package]
name = "eye-break"
version = "0.4.0"
edition = "2021"
description = "Periodic eye-break reminders with guided exercises"
authors = ["Noor ul haq"]

[package.metadata.deb]
maintainer = "Noor ul haq"
copyright = "2026, Noor ul haq"
depends = "$auto, libgtk-3-0, libx11-6"
recommends = "pulseaudio-utils | alsa-utils, xprintidle, x11-utils, xdotool, wmctrl"
section = "utils"
priority = "optional"
extended-description = """
Eye Break sits in your tray and reminds you to take periodic eye breaks,
showing a full-screen overlay with a short guided exercise on each break."""
assets = [
    ["target/release/eye-break", "usr/bin/", "755"],
    ["assets/eye-break.desktop", "usr/share/applications/", "644"],
    ["assets/eye-break.desktop", "etc/xdg/autostart/", "644"],
    ["assets/eye-break-16.png", "usr/share/icons/hicolor/16x16/apps/eye-break.png", "644"],
    ["assets/eye-break-32.png", "usr/share/icons/hicolor/32x32/apps/eye-break.png", "644"],
    ["assets/eye-break-48.png", "usr/share/icons/hicolor/48x48/apps/eye-break.png", "644"],
    ["assets/eye-break-64.png", "usr/share/icons/hicolor/64x64/apps/eye-break.png", "644"],
    ["assets/eye-break-128.png", "usr/share/icons/hicolor/128x128/apps/eye-break.png", "644"],
    ["assets/eye-break-256.png", "usr/share/icons/hicolor/256x256/apps/eye-break.png", "644"],
]

[dependencies]
egui = "0.29"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
libc = "0.2"

# The tray/scheduler process pumps its event loop very differently per
# platform: GTK's main loop on Linux (what tray-icon requires there), a
# lightweight `tao` loop elsewhere (what tray-icon's macOS/Windows backends
# expect for NSApplication/Win32 message pumping). Kept target-gated so a
# non-Linux build never links GTK/X11 at all.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11"] }
gtk = "0.18"
glib = "0.20"

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
tao = "0.30"

[profile.release]
opt-level = "s"   # optimize for size/CPU-cache friendliness over raw throughput —
                   # this app is idle almost all the time, so a smaller, tighter
                   # binary beats a marginally faster one.
lto = true         # cross-crate inlining, drops a meaningful chunk of dead
                   # monomorphized code (egui/eframe pull in a lot of it).
codegen-units = 1  # trades compile time for better optimization + smaller output.
strip = true       # no debug symbols in the shipped binary.
panic = "abort"    # this app never catches unwinds; skips unwind-table codegen
                   # and the unwinder machinery entirely.
