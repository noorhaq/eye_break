[package]
name = "eye-break"
version = "0.1.0"
edition = "2021"
description = "Periodic eye-break reminders with guided exercises"
authors = ["Noor ul haq"]

[package.metadata.deb]
maintainer = "Noor ul haq"
copyright = "2026, Noor ul haq"
depends = "$auto, libgtk-3-0, libx11-6"
section = "utils"
priority = "optional"
extended-description = """
Eye Break sits in your tray and reminds you to take periodic eye breaks,
showing a full-screen overlay with a short guided exercise on each break."""
assets = [
    ["target/release/eye-break", "usr/bin/", "755"],
    ["assets/eye-break.desktop", "usr/share/applications/", "644"],
    ["assets/eye-break.desktop", "etc/xdg/autostart/", "644"],
    ["assets/eye-break-16.png", "usr/share/icons/hicolor/16x16/apps/eye-break.png", "644"],
    ["assets/eye-break-32.png", "usr/share/icons/hicolor/32x32/apps/eye-break.png", "644"],
    ["assets/eye-break-48.png", "usr/share/icons/hicolor/48x48/apps/eye-break.png", "644"],
    ["assets/eye-break-64.png", "usr/share/icons/hicolor/64x64/apps/eye-break.png", "644"],
    ["assets/eye-break-128.png", "usr/share/icons/hicolor/128x128/apps/eye-break.png", "644"],
    ["assets/eye-break-256.png", "usr/share/icons/hicolor/256x256/apps/eye-break.png", "644"],
]

[dependencies]
egui = "0.29"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11"] }
gtk = "0.18"
glib = "0.20"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 2
