[package]
name = "eye-break"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "0.29"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
gtk = "0.18"
glib = "0.20"

[profile.release]
opt-level = 2
