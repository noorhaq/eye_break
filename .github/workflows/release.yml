name: Release builds

# Builds real, native binaries on each target OS's own runner — there's no
# reliable way to cross-compile the macOS build from Linux (no Apple SDK
# available outside real macOS hardware/CI), so this workflow is the actual
# source of the macOS artifact, not a local dev-machine build.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK/X11 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxdo-dev
      - name: Build
        run: cargo build --release
      - name: Package .deb
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          PKG=/tmp/eyebreak_pkg
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/etc/xdg/autostart"
          for sz in 16 32 48 64 128 256; do
            mkdir -p "$PKG/usr/share/icons/hicolor/${sz}x${sz}/apps"
            cp "assets/eye-break-${sz}.png" "$PKG/usr/share/icons/hicolor/${sz}x${sz}/apps/eye-break.png"
          done
          cp target/release/eye-break "$PKG/usr/bin/"
          strip "$PKG/usr/bin/eye-break"
          cp assets/eye-break.desktop "$PKG/usr/share/applications/"
          cp assets/eye-break.desktop "$PKG/etc/xdg/autostart/"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: eye-break
          Version: ${VERSION}-1
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libx11-6
          Recommends: pulseaudio-utils | alsa-utils, xprintidle, x11-utils, xdotool, wmctrl
          Maintainer: Noor ul haq
          Description: Periodic eye-break reminders with guided exercises
           Eye Break sits in your tray and reminds you to take periodic eye
           breaks, showing a full-screen overlay with a short guided exercise
           on each break.
          EOF
          dpkg-deb --build --root-owner-group "$PKG" "eye-break_${VERSION}-1_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: eye-break-linux-deb
          path: eye-break_*.deb

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin
      - name: Build (Intel)
        run: cargo build --release --target x86_64-apple-darwin
      - name: Combine into a universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/eye-break \
            target/aarch64-apple-darwin/release/eye-break \
            target/x86_64-apple-darwin/release/eye-break
          chmod +x dist/eye-break
      - name: Zip
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          cd dist && zip "../eye-break-${VERSION}-macos-universal.zip" eye-break
      - uses: actions/upload-artifact@v4
        with:
          name: eye-break-macos
          path: eye-break-*-macos-universal.zip

  attach-to-release:
    needs: [linux-deb, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/eye-break-linux-deb/*.deb
            artifacts/eye-break-macos/*.zip
